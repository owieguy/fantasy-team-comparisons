name: Update fantasy comparison site

on:
  schedule:
    # 08:13 UTC = ~3:13 AM US Eastern (EST) / ~4:13 AM Eastern during EDT
    # (roughly Sept-early Nov), since GitHub Actions cron is always UTC and
    # doesn't shift for DST. Deliberately NOT minute 0: GitHub's own docs
    # warn that top-of-the-hour schedules are the most congested and most
    # likely to be delayed or silently dropped -- which is what happened
    # the first week this ran on "0 8 * * 2". In practice even this has
    # been delayed by several hours some weeks (GitHub's schedule trigger
    # is documented as best-effort), so each day below also gets a
    # same-day backup run -- a no-op if the primary already succeeded,
    # since there'd be nothing new to commit.
    - cron: "13 8 * * 1"   # Monday ~3:13 AM Eastern
    - cron: "41 14 * * 1"  # Monday backup, ~6.5h later
    - cron: "13 8 * * 2"   # Tuesday ~3:13 AM Eastern
    - cron: "41 14 * * 2"  # Tuesday backup, ~6.5h later
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update fantasy comparison data"
          git push
